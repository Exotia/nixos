# Systemd & Session setup
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all
exec-once = nix-theme-update

# Core services
exec-once = waybar
exec-once = uwsm-app -- hypridle
exec-once = mako
# exec-once = uwsm-app -- fcitx5 --disable notificationitem
exec-once = swayosd-server
exec-once = lxqt-policykit-agent
exec-once = nm-applet --indicator

# Background initialization
exec-once = mkdir -p ~/.cache
exec-once = [ -L ~/.cache/current-background ] || ln -sf ~/.config/theme/backgrounds/0-swirl-buck.jpg ~/.cache/current-background
exec-once = swaybg -i ~/.cache/current-background -m fill

# Setup scripts

