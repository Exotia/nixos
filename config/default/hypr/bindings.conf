# Deprecated bindings file. New installations include everything directly.

bind = SUPER, RETURN, $terminal
bind = SUPER, F, $fileManager
bind = SUPER, B, $browser
bind = SUPER, M, $music
bind = SUPER, N, $terminal -e nvim
bind = SUPER, T, $terminal -e btop
bind = SUPER, D, $terminal -e lazydocker
bind = SUPER, G, $messenger
bind = SUPER, O, obsidian -disable-gpu
bind = SUPER, SLASH, $passwordManager

source = ~/.config/default/hypr/bindings/media.conf
source = ~/.config/default/hypr/bindings/tiling.conf
source = ~/.config/default/hypr/bindings/utilities.conf
