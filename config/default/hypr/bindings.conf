# Deprecated bindings file. New installations include everything directly.

bind = SUPER, RETURN, Terminal, exec, $terminal
bind = SUPER, F, File manager, exec, $fileManager
bind = SUPER, B, Web browser, exec, $browser
bind = SUPER, M, Music player, exec, $music
bind = SUPER, N, Neovim, exec, $terminal -e nvim
bind = SUPER, T, Top, exec, $terminal -e btop
bind = SUPER, D, Lazy Docker, exec, $terminal -e lazydocker
bind = SUPER, G, Messenger, exec, $messenger
bind = SUPER, O, Obsidian, exec, obsidian -disable-gpu
bind = SUPER, SLASH, Password manager, exec, $passwordManager

source = ~/.config/default/hypr/bindings/media.conf
source = ~/.config/default/hypr/bindings/tiling.conf
source = ~/.config/default/hypr/bindings/utilities.conf
