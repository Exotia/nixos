# Only display the OSD on the currently focused monitor
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# Laptop multimedia keys for volume and LCD brightness (with OSD)
binde = ,XF86AudioRaiseVolume, Volume up, exec, $osdclient --output-volume raise
binde = ,XF86AudioLowerVolume, Volume down, exec, $osdclient --output-volume lower
binde = ,XF86AudioMute, Mute, exec, $osdclient --output-volume mute-toggle
binde = ,XF86AudioMicMute, Mute microphone, exec, $osdclient --input-volume mute-toggle
binde = ,XF86MonBrightnessUp, Brightness up, exec, nix-brightness-display +5%
binde = ,XF86MonBrightnessDown, Brightness down, exec, nix-brightness-display 5%-
binde = ,XF86KbdBrightnessUp, Keyboard brightness up, exec, nix-brightness-keyboard up
binde = ,XF86KbdBrightnessDown, Keyboard brightness down, exec, nix-brightness-keyboard down
bindl = ,XF86KbdLightOnOff, Keyboard backlight cycle, exec, nix-brightness-keyboard cycle

# Precise 1% multimedia adjustments with Alt modifier
binde = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $osdclient --output-volume +1
binde = ALT, XF86AudioLowerVolume, Volume down precise, exec, $osdclient --output-volume -1
binde = ALT, XF86MonBrightnessUp, Brightness up precise, exec, nix-brightness-display +1%
binde = ALT, XF86MonBrightnessDown, Brightness down precise, exec, nix-brightness-display 1%-

# Requires playerctl
bindl = , XF86AudioNext, Next track, exec, $osdclient --playerctl next
bindl = , XF86AudioPause, Pause, exec, $osdclient --playerctl play-pause
bindl = , XF86AudioPlay, Play, exec, $osdclient --playerctl play-pause
bindl = , XF86AudioPrev, Previous track, exec, $osdclient --playerctl previous

# Switch audio output with Super + Mute
bindl = SUPER, XF86AudioMute, Switch audio output, exec, nix-cmd-audio-switch
