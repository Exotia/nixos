# Only display the OSD on the currently focused monitor
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindel =  , XF86AudioRaiseVolume, exec, exec, $osdclient --output-volume raise
bindel =  , XF86AudioLowerVolume, exec, exec, $osdclient --output-volume lower
bindel =  , XF86AudioMute, exec, exec, $osdclient --output-volume mute-toggle
bindel =  , XF86AudioMicMute, exec, exec, $osdclient --input-volume mute-toggle
bindel =  , XF86MonBrightnessUp, exec, exec, arch-brightness-display +5%
bindel =  , XF86MonBrightnessDown, exec, exec, arch-brightness-display 5%-
bindel =  , XF86KbdBrightnessUp, exec, exec, arch-brightness-keyboard up
bindel =  , XF86KbdBrightnessDown, exec, exec, arch-brightness-keyboard down
bindl =  , XF86KbdLightOnOff, exec, exec, arch-brightness-keyboard cycle

# Precise 1% multimedia adjustments with Alt modifier
bindel = ALT, XF86AudioRaiseVolume, exec, exec, $osdclient --output-volume +1
bindel = ALT, XF86AudioLowerVolume, exec, exec, $osdclient --output-volume -1
bindel = ALT, XF86MonBrightnessUp, exec, exec, arch-brightness-display +1%
bindel = ALT, XF86MonBrightnessDown, exec, exec, arch-brightness-display 1%-

# Requires playerctl
bindl =  , XF86AudioNext, exec, exec, $osdclient --playerctl next
bindl =  , XF86AudioPause, exec, exec, $osdclient --playerctl play-pause
bindl =  , XF86AudioPlay, exec, exec, $osdclient --playerctl play-pause
bindl =  , XF86AudioPrev, exec, exec, $osdclient --playerctl previous

# Switch audio output with Super + Mute
bindl = SUPER, XF86AudioMute, exec, exec, arch-cmd-audio-switch
