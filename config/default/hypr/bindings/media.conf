# Only display the OSD on the currently focused monitor
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# Laptop multimedia keys for volume and LCD brightness (with OSD)
binde =  , XF86AudioRaiseVolume, $osdclient --output-volume raise
binde =  , XF86AudioLowerVolume, $osdclient --output-volume lower
binde =  , XF86AudioMute, $osdclient --output-volume mute-toggle
binde =  , XF86AudioMicMute, $osdclient --input-volume mute-toggle
binde =  , XF86MonBrightnessUp, nix-brightness-display +5%
binde =  , XF86MonBrightnessDown, nix-brightness-display 5%-
binde =  , XF86KbdBrightnessUp, nix-brightness-keyboard up
binde =  , XF86KbdBrightnessDown, nix-brightness-keyboard down
bindl =  , XF86KbdLightOnOff, nix-brightness-keyboard cycle

# Precise 1% multimedia adjustments with Alt modifier
binde = ALT, XF86AudioRaiseVolume, $osdclient --output-volume +1
binde = ALT, XF86AudioLowerVolume, $osdclient --output-volume -1
binde = ALT, XF86MonBrightnessUp, nix-brightness-display +1%
binde = ALT, XF86MonBrightnessDown, nix-brightness-display 1%-

# Requires playerctl
bindl =  , XF86AudioNext, $osdclient --playerctl next
bindl =  , XF86AudioPause, $osdclient --playerctl play-pause
bindl =  , XF86AudioPlay, $osdclient --playerctl play-pause
bindl =  , XF86AudioPrev, $osdclient --playerctl previous

# Switch audio output with Super + Mute
bindl = SUPER, XF86AudioMute, nix-cmd-audio-switch
