# Close windows
bind = SUPER, W, exec, 
bind = CTRL ALT, DELETE, exec, nix-hyprland-window-close-all

# Control tiling
bind = SUPER, J, exec, togglesplit
bind = SUPER, P, exec, # dwindle
bind = SUPER, T, exec, 
bind = SUPER, F, exec, 0
bind = SUPER CTRL, F, exec, 0 2
bind = SUPER ALT, F, exec, 1
bind = SUPER, O, exec, nix-hyprland-window-pop
bind = SUPER, L, exec, nix-hyprland-workspace-layout-toggle

# Move focus with SUPER + arrow keys
bind = SUPER, LEFT, exec, l
bind = SUPER, RIGHT, exec, r
bind = SUPER, UP, exec, u
bind = SUPER, DOWN, exec, d

# Switch workspaces with SUPER + [1-9; 0]
bind = SUPER, code:10, exec, 1
bind = SUPER, code:11, exec, 2
bind = SUPER, code:12, exec, 3
bind = SUPER, code:13, exec, 4
bind = SUPER, code:14, exec, 5
bind = SUPER, code:15, exec, 6
bind = SUPER, code:16, exec, 7
bind = SUPER, code:17, exec, 8
bind = SUPER, code:18, exec, 9
bind = SUPER, code:19, exec, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9; 0]
bind = SUPER SHIFT, code:10, exec, 1
bind = SUPER SHIFT, code:11, exec, 2
bind = SUPER SHIFT, code:12, exec, 3
bind = SUPER SHIFT, code:13, exec, 4
bind = SUPER SHIFT, code:14, exec, 5
bind = SUPER SHIFT, code:15, exec, 6
bind = SUPER SHIFT, code:16, exec, 7
bind = SUPER SHIFT, code:17, exec, 8
bind = SUPER SHIFT, code:18, exec, 9
bind = SUPER SHIFT, code:19, exec, 10

# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
bind = SUPER SHIFT ALT, code:10, exec, 1
bind = SUPER SHIFT ALT, code:11, exec, 2
bind = SUPER SHIFT ALT, code:12, exec, 3
bind = SUPER SHIFT ALT, code:13, exec, 4
bind = SUPER SHIFT ALT, code:14, exec, 5
bind = SUPER SHIFT ALT, code:15, exec, 6
bind = SUPER SHIFT ALT, code:16, exec, 7
bind = SUPER SHIFT ALT, code:17, exec, 8
bind = SUPER SHIFT ALT, code:18, exec, 9
bind = SUPER SHIFT ALT, code:19, exec, 10

# Control scratchpad
bind = SUPER, S, exec, scratchpad
bind = SUPER ALT, S, exec, special:scratchpad

# TAB between workspaces
bind = SUPER, TAB, exec, e+1
bind = SUPER SHIFT, TAB, exec, e-1
bind = SUPER CTRL, TAB, exec, previous

# Move workspaces to other monitors
bind = SUPER SHIFT ALT, LEFT, exec, l
bind = SUPER SHIFT ALT, RIGHT, exec, r
bind = SUPER SHIFT ALT, UP, exec, u
bind = SUPER SHIFT ALT, DOWN, exec, d

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bind = SUPER SHIFT, LEFT, exec, l
bind = SUPER SHIFT, RIGHT, exec, r
bind = SUPER SHIFT, UP, exec, u
bind = SUPER SHIFT, DOWN, exec, d

# Cycle through applications on active workspace
bind = ALT, TAB, exec, cyclenext
bind = ALT SHIFT, TAB, exec, prev
bind = ALT, TAB, exec, bringactivetotop
bind = ALT SHIFT, TAB, exec, bringactivetotop

# Resize active window
bind = SUPER, code:20, exec, -100 0    # - key
bind = SUPER, code:21, exec, 100 0     # = key
bind = SUPER SHIFT, code:20, exec, 0 -100
bind = SUPER SHIFT, code:21, exec, 0 100

# Scroll through existing workspaces with SUPER + scroll
bind = SUPER, mouse_down, exec, e+1
bind = SUPER, mouse_up, exec, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, movewindow
bindmd = SUPER, mouse:273, exec, resizewindow

# Toggle groups
bind = SUPER, G, exec, togglegroup
bind = SUPER ALT, G, exec, moveoutofgroup

# Join groups
bind = SUPER ALT, LEFT, exec, l
bind = SUPER ALT, RIGHT, exec, r
bind = SUPER ALT, UP, exec, u
bind = SUPER ALT, DOWN, exec, d

# Navigate a single set of grouped windows
bind = SUPER ALT, TAB, exec, f
bind = SUPER ALT SHIFT, TAB, exec, b

# Window navigation for grouped windows
bind = SUPER CTRL, LEFT, exec, b
bind = SUPER CTRL, RIGHT, exec, f

# Scroll through a set of grouped windows with SUPER + ALT + scroll
bind = SUPER ALT, mouse_down, exec, f
bind = SUPER ALT, mouse_up, exec, b

# Activate window in a group by number
bind = SUPER ALT, code:10, exec, 1
bind = SUPER ALT, code:11, exec, 2
bind = SUPER ALT, code:12, exec, 3
bind = SUPER ALT, code:13, exec, 4
bind = SUPER ALT, code:14, exec, 5

# Cycle monitor scaling
bind = SUPER, Slash, exec, nix-hyprland-monitor-scaling-cycle
