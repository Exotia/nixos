# Close windows
bind = SUPER, W, 
bind = CTRL ALT, DELETE, nix-hyprland-window-close-all

# Control tiling
bind = SUPER, J, togglesplit
bind = SUPER, P, # dwindle
bind = SUPER, T, 
bind = SUPER, F, 0
bind = SUPER CTRL, F, 0 2
bind = SUPER ALT, F, 1
bind = SUPER, O, nix-hyprland-window-pop
bind = SUPER, L, nix-hyprland-workspace-layout-toggle

# Move focus with SUPER + arrow keys
bind = SUPER, LEFT, l
bind = SUPER, RIGHT, r
bind = SUPER, UP, u
bind = SUPER, DOWN, d

# Switch workspaces with SUPER + [1-9; 0]
bind = SUPER, code:10, 1
bind = SUPER, code:11, 2
bind = SUPER, code:12, 3
bind = SUPER, code:13, 4
bind = SUPER, code:14, 5
bind = SUPER, code:15, 6
bind = SUPER, code:16, 7
bind = SUPER, code:17, 8
bind = SUPER, code:18, 9
bind = SUPER, code:19, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9; 0]
bind = SUPER SHIFT, code:10, 1
bind = SUPER SHIFT, code:11, 2
bind = SUPER SHIFT, code:12, 3
bind = SUPER SHIFT, code:13, 4
bind = SUPER SHIFT, code:14, 5
bind = SUPER SHIFT, code:15, 6
bind = SUPER SHIFT, code:16, 7
bind = SUPER SHIFT, code:17, 8
bind = SUPER SHIFT, code:18, 9
bind = SUPER SHIFT, code:19, 10

# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
bind = SUPER SHIFT ALT, code:10, 1
bind = SUPER SHIFT ALT, code:11, 2
bind = SUPER SHIFT ALT, code:12, 3
bind = SUPER SHIFT ALT, code:13, 4
bind = SUPER SHIFT ALT, code:14, 5
bind = SUPER SHIFT ALT, code:15, 6
bind = SUPER SHIFT ALT, code:16, 7
bind = SUPER SHIFT ALT, code:17, 8
bind = SUPER SHIFT ALT, code:18, 9
bind = SUPER SHIFT ALT, code:19, 10

# Control scratchpad
bind = SUPER, S, scratchpad
bind = SUPER ALT, S, special:scratchpad

# TAB between workspaces
bind = SUPER, TAB, e+1
bind = SUPER SHIFT, TAB, e-1
bind = SUPER CTRL, TAB, previous

# Move workspaces to other monitors
bind = SUPER SHIFT ALT, LEFT, l
bind = SUPER SHIFT ALT, RIGHT, r
bind = SUPER SHIFT ALT, UP, u
bind = SUPER SHIFT ALT, DOWN, d

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bind = SUPER SHIFT, LEFT, l
bind = SUPER SHIFT, RIGHT, r
bind = SUPER SHIFT, UP, u
bind = SUPER SHIFT, DOWN, d

# Cycle through applications on active workspace
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, prev
bind = ALT, TAB, bringactivetotop
bind = ALT SHIFT, TAB, bringactivetotop

# Resize active window
bind = SUPER, code:20, -100 0    # - key
bind = SUPER, code:21, 100 0     # = key
bind = SUPER SHIFT, code:20, 0 -100
bind = SUPER SHIFT, code:21, 0 100

# Scroll through existing workspaces with SUPER + scroll
bind = SUPER, mouse_down, e+1
bind = SUPER, mouse_up, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, movewindow
bindmd = SUPER, mouse:273, resizewindow

# Toggle groups
bind = SUPER, G, togglegroup
bind = SUPER ALT, G, moveoutofgroup

# Join groups
bind = SUPER ALT, LEFT, l
bind = SUPER ALT, RIGHT, r
bind = SUPER ALT, UP, u
bind = SUPER ALT, DOWN, d

# Navigate a single set of grouped windows
bind = SUPER ALT, TAB, f
bind = SUPER ALT SHIFT, TAB, b

# Window navigation for grouped windows
bind = SUPER CTRL, LEFT, b
bind = SUPER CTRL, RIGHT, f

# Scroll through a set of grouped windows with SUPER + ALT + scroll
bind = SUPER ALT, mouse_down, f
bind = SUPER ALT, mouse_up, b

# Activate window in a group by number
bind = SUPER ALT, code:10, 1
bind = SUPER ALT, code:11, 2
bind = SUPER ALT, code:12, 3
bind = SUPER ALT, code:13, 4
bind = SUPER ALT, code:14, 5

# Cycle monitor scaling
bind = SUPER, Slash, nix-hyprland-monitor-scaling-cycle
