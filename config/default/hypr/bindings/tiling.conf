# This is now a deprecated file meant for those who did not wish to learn the latest Omarchy hotkeys.
# Do not make changes here, but bring them to tiling-v2.conf instead.

# Close windows
bind = SUPER, W, Close window, killactive,
bind = CTRL ALT, DELETE, Close all windows, exec, nix-hyprland-window-close-all

# Control tiling
bind = SUPER, J, Toggle window split, togglesplit, # dwindle
bind = SUPER, P, Pseudo window, pseudo, # dwindle
bind = SUPER SHIFT, V, Toggle window floating/tiling, togglefloating,
bind = SHIFT, F11, Force full screen, fullscreen, 0
bind = ALT, F11, Full width, fullscreen, 1

# Move focus with SUPER + arrow keys
bind = SUPER, LEFT, Move focus left, movefocus, l
bind = SUPER, RIGHT, Move focus right, movefocus, r
bind = SUPER, UP, Move focus up, movefocus, u
bind = SUPER, DOWN, Move focus down, movefocus, d

# Switch workspaces with SUPER + [0-9]
bind = SUPER, code:10, Switch to workspace 1, workspace, 1
bind = SUPER, code:11, Switch to workspace 2, workspace, 2
bind = SUPER, code:12, Switch to workspace 3, workspace, 3
bind = SUPER, code:13, Switch to workspace 4, workspace, 4
bind = SUPER, code:14, Switch to workspace 5, workspace, 5
bind = SUPER, code:15, Switch to workspace 6, workspace, 6
bind = SUPER, code:16, Switch to workspace 7, workspace, 7
bind = SUPER, code:17, Switch to workspace 8, workspace, 8
bind = SUPER, code:18, Switch to workspace 9, workspace, 9
bind = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bind = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bind = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bind = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bind = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bind = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bind = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bind = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bind = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bind = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bind = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# TAB between workspaces
bind = SUPER, TAB, Next workspace, workspace, e+1
bind = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bind = SUPER CTRL, TAB, Former workspace, workspace, previous

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bind = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
bind = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
bind = SUPER SHIFT, UP, Swap window up, swapwindow, u
bind = SUPER SHIFT, DOWN, Swap window down, swapwindow, d

# Cycle through applications on active workspace
bind = ALT, TAB, Cycle to next window, cyclenext
bind = ALT SHIFT, TAB, Cycle to prev window, cyclenext, prev
bind = ALT, TAB, Reveal active window on top, bringactivetotop
bind = ALT SHIFT, TAB, Reveal active window on top, bringactivetotop

# Resize active window
bind = SUPER, code:20, Expand window left, resizeactive, -100 0    # - key
bind = SUPER, code:21, Shrink window left, resizeactive, 100 0     # = key
bind = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bind = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100

# Scroll through existing workspaces with SUPER + scroll
bind = SUPER, MOUSE_DOWN, Scroll active workspace forward, workspace, e+1
bind = SUPER, MOUSE_UP, Scroll active workspace backward, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow
