# Menus
bind = SUPER, SPACE, Launch apps, exec, nix-launch-walker
bind = SUPER CTRL, E, Emoji picker, exec, nix-launch-walker -m symbols
bind = SUPER CTRL, C, Capture menu, exec, nix-menu capture
bind = SUPER CTRL, O, Toggle menu, exec, nix-menu toggle
bind = SUPER ALT, SPACE, Omarchy menu, exec, nix-menu
bind = SUPER, ESCAPE, System menu, exec, nix-menu system
bindl = , XF86PowerOff, Power menu, exec, nix-menu system
bind = SUPER, K, Show key bindings, exec, nix-menu-keybindings
bind = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bind = SUPER SHIFT, SPACE, Toggle top bar, exec, nix-toggle-waybar
bind = SUPER CTRL, SPACE, Theme background menu, exec, nix-menu background
bind = SUPER SHIFT CTRL, SPACE, Theme menu, exec, nix-menu theme
bind = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bind = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, nix-hyprland-window-gaps-toggle
bind = SUPER CTRL, BACKSPACE, Toggle single-window square aspect, exec, nix-hyprland-window-single-square-aspect-toggle

# Notifications
bind = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bind = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bind = SUPER CTRL, COMMA, Toggle silencing notifications, exec, nix-toggle-notification-silencing
bind = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bind = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bind = SUPER CTRL, I, Toggle locking on idle, exec, nix-toggle-idle
bind = SUPER CTRL, N, Toggle nightlight, exec, nix-toggle-nightlight

# Control Apple Display brightness
bind = CTRL, F1, Apple Display brightness down, exec, nix-brightness-display-apple -5000
bind = CTRL, F2, Apple Display brightness up, exec, nix-brightness-display-apple +5000
bind = SHIFT CTRL, F2, Apple Display full brightness, exec, nix-brightness-display-apple +60000

# Captures
bind = , PRINT, Screenshot, exec, nix-cmd-screenshot
bind = ALT, PRINT, Screenrecording, exec, nix-menu screenrecord
bind = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# File sharing
bind = SUPER CTRL, S, Share, exec, nix-menu share

# Waybar-less information
bind = SUPER CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bind = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send "$(nix-battery-status)"

# Control panels
bind = SUPER CTRL, A, Audio controls, exec, nix-launch-audio
bind = SUPER CTRL, B, Bluetooth controls, exec, nix-launch-bluetooth
bind = SUPER CTRL, W, Wifi controls, exec, nix-launch-wifi
bind = SUPER CTRL, T, Activity, exec, nix-launch-tui btop

# Dictation
bind = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle

# Zoom
bind = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bind = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bind = SUPER CTRL, L, Lock system, exec, nix-lock-screen
