# Menus
# bind = SUPER, SPACE, exec, fuzzel
bind = SUPER CTRL, SPACE, exec, $HOME/nixos-dotfiles/config/scripts/nix-menu-theming
bind =  , XF86Calculator, exec, gnome-calculator

# Aesthetics
bind = SUPER SHIFT, SPACE, exec, nix-toggle-waybar
bind = SUPER, BACKSPACE, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bind = SUPER SHIFT, BACKSPACE, exec, nix-hyprland-window-gaps-toggle
bind = SUPER CTRL, BACKSPACE, exec, nix-hyprland-window-single-square-aspect-toggle

# Notifications
bind = SUPER, COMMA, exec, makoctl dismiss
bind = SUPER SHIFT, COMMA, exec, makoctl dismiss --all
bind = SUPER CTRL, COMMA, exec, nix-toggle-notification-silencing
bind = SUPER ALT, COMMA, exec, makoctl invoke
bind = SUPER SHIFT ALT, COMMA, exec, makoctl restore

# Toggles
bind = SUPER CTRL, I, exec, nix-toggle-idle
bind = SUPER CTRL, N, exec, nix-toggle-nightlight

# Captures
bind =  , PRINT, exec, nix-cmd-screenshot
bind = SUPER, PRINT, exec, pkill hyprpicker || hyprpicker -a

# Waybar-less information
bind = SUPER CTRL ALT, T, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bind = SUPER CTRL ALT, B, exec, notify-send "$(nix-battery-status)"

# Control panels
bind = SUPER CTRL, A, exec, alacritty -e pulsemixer
# bind = SUPER CTRL, B, exec, alacritty -e bluetuith
bind = SUPER CTRL, W, exec, alacritty -e nmtui
bind = SUPER CTRL, T, exec, alacritty --class TUI.float -e btop

# Zoom
bind = SUPER CTRL, Z, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bind = SUPER CTRL ALT, Z, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bind = SUPER CTRL, L, exec, nix-lock-screen
