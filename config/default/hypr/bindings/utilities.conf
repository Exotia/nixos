# Menus
bind = SUPER, SPACE, nix-launch-walker
bind = SUPER CTRL, E, nix-launch-walker -m symbols
bind = SUPER CTRL, C, nix-menu capture
bind = SUPER CTRL, O, nix-menu toggle
bind = SUPER ALT, SPACE, nix-menu
bind = SUPER, ESCAPE, nix-menu system
bindl =  , XF86PowerOff, nix-menu system
bind = SUPER, K, nix-menu-keybindings
bind =  , XF86Calculator, gnome-calculator

# Aesthetics
bind = SUPER SHIFT, SPACE, nix-toggle-waybar
bind = SUPER CTRL, SPACE, nix-menu background
bind = SUPER SHIFT CTRL, SPACE, nix-menu theme
bind = SUPER, BACKSPACE, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bind = SUPER SHIFT, BACKSPACE, nix-hyprland-window-gaps-toggle
bind = SUPER CTRL, BACKSPACE, nix-hyprland-window-single-square-aspect-toggle

# Notifications
bind = SUPER, COMMA, makoctl dismiss
bind = SUPER SHIFT, COMMA, makoctl dismiss --all
bind = SUPER CTRL, COMMA, nix-toggle-notification-silencing
bind = SUPER ALT, COMMA, makoctl invoke
bind = SUPER SHIFT ALT, COMMA, makoctl restore

# Toggles
bind = SUPER CTRL, I, nix-toggle-idle
bind = SUPER CTRL, N, nix-toggle-nightlight

# Control Apple Display brightness
bind = CTRL, F1, nix-brightness-display-apple -5000
bind = CTRL, F2, nix-brightness-display-apple +5000
bind = SHIFT CTRL, F2, nix-brightness-display-apple +60000

# Captures
bind =  , PRINT, nix-cmd-screenshot
bind = ALT, PRINT, nix-menu screenrecord
bind = SUPER, PRINT, pkill hyprpicker || hyprpicker -a

# File sharing
bind = SUPER CTRL, S, nix-menu share

# Waybar-less information
bind = SUPER CTRL ALT, T, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bind = SUPER CTRL ALT, B, notify-send "$(nix-battery-status)"

# Control panels
bind = SUPER CTRL, A, nix-launch-audio
bind = SUPER CTRL, B, nix-launch-bluetooth
bind = SUPER CTRL, W, nix-launch-wifi
bind = SUPER CTRL, T, nix-launch-tui btop

# Dictation
bind = SUPER CTRL, X, voxtype record toggle

# Zoom
bind = SUPER CTRL, Z, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bind = SUPER CTRL ALT, Z, hyprctl keyword cursor:zoom_factor 1

# Lock system
bind = SUPER CTRL, L, nix-lock-screen
