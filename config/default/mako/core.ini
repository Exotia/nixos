anchor=top-right
default-timeout=5000
width=350
outer-margin=20
padding=20
border-size=2
border-radius=6
max-icon-size=48
font=JetBrainsMono Nerd Font 11

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=critical]
default-timeout=0
layer=overlay

[summary~="Setup Wi-Fi"]
# on-button-left=exec sh -c '...'

[summary~="Update System"]
# on-button-left=exec sh -c '...'

[summary~="Learn Keybindings"]
on-button-left=exec sh -c 'makoctl dismiss; /home/ole/nixos-dotfiles/config/scripts/nix-menu-keybindings'

[summary~="Screenshot copied & saved"]
max-icon-size=80
format=<b>%s</b>\n%b
