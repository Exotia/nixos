# Application bindings (SUPER only, no SHIFT)
bind = SUPER, SPACE, exec, /home/ole/nixos-dotfiles/config/scripts/nix-menu-apps-favorites
bind = SUPER, A, exec, /home/ole/nixos-dotfiles/config/scripts/nix-app-launcher.py

# Core Apps
bind = SUPER, RETURN, exec, uwsm-app -- xdg-terminal-exec --dir="$(nix-cmd-terminal-cwd)"
bind = SUPER SHIFT, RETURN, exec, uwsm-app -- brave
bind = SUPER, F, exec, uwsm-app -- pcmanfm --new-window
bind = SUPER, S, exec, nix-launch-or-focus spotify
bind = SUPER, O, exec, nix-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bind = SUPER, G, exec, uwsm-app -- brave gemini.google.com

# Advanced App Options
bind = SUPER ALT, RETURN, exec, uwsm-app -- brave --incognito
bind = SUPER ALT, F, exec, uwsm-app -- pcmanfm --new-window "$(nix-cmd-terminal-cwd)"

# Web Apps
bind = SUPER, Y, exec, $HOME/.config/scripts/launch-webapp https://youtube.com --ozone-platform-hint=auto --force-dark-mode --enable-features=WebUIDarkMode,DefaultPascalCaseDynamicRefColors --dark-mode
bind = SUPER, T, exec, $HOME/.config/scripts/launch-webapp https://twitch.com --ozone-platform-hint=auto --force-dark-mode --enable-features=WebUIDarkMode,DefaultPascalCaseDynamicRefColors --dark-mode

# System management
bind = SUPER, ESCAPE, exec, systemctl poweroff

# Extra menus
bind = SUPER CTRL, SPACE, exec, /home/ole/nixos-dotfiles/config/scripts/nix-menu-keybindings
