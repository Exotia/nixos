# Application bindings
bind = SUPER, SPACE, exec, /home/ole/nixos-dotfiles/config/scripts/nix-menu-apps-favorites
bind = SUPER, A, exec, /home/ole/nixos-dotfiles/config/scripts/nix-app-launcher.py
# bind = SUPER, code:65, exec, ...
bind = SUPER, RETURN, exec, uwsm-app -- xdg-terminal-exec --dir="$(nix-cmd-terminal-cwd)"
bind = SUPER ALT, RETURN, exec, uwsm-app -- xdg-terminal-exec --dir="$(nix-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bind = SUPER SHIFT, RETURN, exec, uwsm-app -- brave
bind = SUPER SHIFT, F, exec, uwsm-app -- pcmanfm --new-window
bind = SUPER ALT SHIFT, F, exec, uwsm-app -- pcmanfm --new-window "$(nix-cmd-terminal-cwd)"
bind = SUPER SHIFT, B, exec, uwsm-app -- brave
bind = SUPER SHIFT ALT, B, exec, uwsm-app -- brave --incognito
bind = SUPER SHIFT, M, exec, nix-launch-or-focus spotify
bind = SUPER SHIFT, N, exec, uwsm-app -- alacritty -e nvim
bind = SUPER SHIFT, D, exec, uwsm-app -- alacritty --class TUI.float -e lazygit
bind = SUPER SHIFT, O, exec, nix-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bind = SUPER SHIFT, Y, exec, uwsm-app -- brave --app="https://youtube.com/"
bind = SUPER SHIFT ALT, G, exec, nix-launch-or-focus WhatsApp "uwsm-app -- brave --app=https://web.whatsapp.com/"
bind = SUPER SHIFT CTRL, G, exec, nix-launch-or-focus "Google Messages" "uwsm-app -- brave --app=https://messages.google.com/web/conversations"
bind = SUPER SHIFT, P, exec, nix-launch-or-focus "Google Photos" "uwsm-app -- brave --app=https://photos.google.com/"

# Add extra bindings
bind = SUPER CTRL, SPACE, exec, /home/ole/nixos-dotfiles/config/scripts/nix-menu-keybindings
# bind = SUPER SHIFT, R, alacritty -e ssh your-server
