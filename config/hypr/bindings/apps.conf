# SUPER + key: launch applications and web apps.
# Define each command once as a variable, then bind it. Add a new app = one $var + one bind.

$scripts = $HOME/nixos-dotfiles/config/scripts
$terminal = uwsm-app -- xdg-terminal-exec --dir="$(nix-cmd-terminal-cwd)"
$browser = uwsm-app -- brave
$fileManager = uwsm-app -- pcmanfm --new-window
$webapp = $HOME/.config/scripts/launch-webapp
$webappFlags = --ozone-platform-hint=auto --force-dark-mode --enable-features=WebUIDarkMode,DefaultPascalCaseDynamicRefColors --dark-mode

# Menus
bind = SUPER, SPACE, exec, $scripts/nix-menu-apps-favorites
bind = SUPER, A, exec, $scripts/nix-app-launcher.py

# Core apps
bind = SUPER, RETURN, exec, $terminal
bind = SUPER SHIFT, RETURN, exec, $browser
bind = SUPER ALT, RETURN, exec, $browser --incognito
bind = SUPER, F, exec, $fileManager
bind = SUPER ALT, F, exec, $fileManager "$(nix-cmd-terminal-cwd)"
bind = SUPER, S, exec, nix-launch-or-focus spotify
bind = SUPER, O, exec, nix-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bind = SUPER, G, exec, $browser gemini.google.com

# Web apps
bind = SUPER, Y, exec, $webapp https://youtube.com $webappFlags
bind = SUPER, T, exec, $webapp https://twitch.com $webappFlags
