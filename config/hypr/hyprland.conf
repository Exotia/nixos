# Hyprland entry point. Only source= lines live here.
# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Look, input, monitors, environment
source = ./envs.conf
source = ./monitors.conf
source = ./input.conf
source = ./looknfeel.conf
source = ./theme.conf

# Window rules (general rules + one file per app in ./rules/)
source = ./windows.conf

# Keybindings, one file per modifier group
#   apps.conf      SUPER + key          launch applications and web apps
#   windows.conf   SUPER + SHIFT / ALT  focus, move, resize, workspaces, tiling
#   system.conf    SUPER + CTRL         lock, idle, menus, panels, notifications
#   clipboard.conf SUPER + C/V/X        copy, paste, cut
#   media.conf     XF86 keys            volume, brightness, playback
source = ./bindings/apps.conf
source = ./bindings/windows.conf
source = ./bindings/system.conf
source = ./bindings/clipboard.conf
source = ./bindings/media.conf

# Programs started with the session
source = ./autostart.conf
