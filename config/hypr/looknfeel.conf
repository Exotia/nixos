# Custom Hyprland look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # Slightly smaller gaps between windows, but keep the outer "floating" gap
    gaps_in = 4
    gaps_out = 10
    border_size = 2

    # Smooth border color (using your theme's active border)
    col.active_border = $activeBorderColor
    col.inactive_border = rgba(595959aa)
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Nice rounded corners matching Waybar/Fuzzel
    rounding = 10

    # Bigger, more prominent shadows for an even stronger floating effect
    shadow {
        enabled = true
        range = 35
        render_power = 4
        color = rgba(0, 0, 0, 0.45)
        offset = 0, 4
    }

    # Add a bit of blur to help windows stand out from the background
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }

    # Dim unfocused windows slightly
    dim_inactive = true
    dim_strength = 0.1
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes
    
    # Smooth animations for opening/closing windows
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
