# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Disable global 2x scaling for 1080p monitors
env = GDK_SCALE,1

# Left Monitor (DP-3) - 60Hz
monitor = DP-3, 1920x1080@60, 0x0, 1

# Middle Monitor (DP-4) - 240Hz Gaming Monitor
monitor = DP-4, 1920x1080@240, 1920x0, 1

# Right Monitor (HDMI-A-1) - 100Hz - Upside Down (180° rotation)
monitor = HDMI-A-1, 1920x1080@100, 3840x0, 1, transform, 2

# Workspace assignments
workspace = 1, monitor:DP-4, default:true
workspace = 2, monitor:DP-3
workspace = 3, monitor:HDMI-A-1

